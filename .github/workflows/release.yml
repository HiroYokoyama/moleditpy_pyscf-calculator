name: Release

on:
  workflow_dispatch:
    inputs:
      zenodo:
        description: 'Upload and publish to Zenodo after the release'
        required: false
        type: boolean
        default: true
      version:
        description: 'Release version (e.g. 4.0.0 — without leading v)'
        required: true
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Create and push tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"

      - name: Verify version matches plugin source
        run: |
          INPUT="$VERSION"
          FILE_VERSION=$(python3 -c "
          import re, sys
          text = open('pyscf_calculator/__init__.py', encoding='utf-8').read()
          m = re.search(r\"PLUGIN_VERSION\s*=\s*['\\\"](.+?)['\\\"]\", text)
          print(m.group(1).strip() if m else '')
          ")
          echo "Input version : $INPUT"
          echo "File version  : $FILE_VERSION"
          if [ "$INPUT" != "$FILE_VERSION" ]; then
            echo "ERROR: input version '$INPUT' does not match PLUGIN_VERSION '$FILE_VERSION' in pyscf_calculator/__init__.py"
            exit 1
          fi

      - name: Build release package
        run: |
          TAG="$VERSION"
          cp README.md LICENSE pyscf_calculator/
          zip -r "pyscf_calculator_${TAG}.zip" pyscf_calculator/ --exclude "*/__pycache__/*" "*/.git/*"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$VERSION"
          gh release create "v$TAG" \
            --title "PySCF Calculator $TAG" \
            --generate-notes \
            "pyscf_calculator_$TAG.zip"

      - name: Trigger moleditpy-plugins registry update
        if: success()
        continue-on-error: true
        env:
          REGISTRY_PAT: ${{ secrets.REGISTRY_PAT }}
        run: |
          TAG="$VERSION"
          if [ -n "$REGISTRY_PAT" ]; then
            curl -s -X POST \
              -H "Authorization: Bearer $REGISTRY_PAT" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/HiroYokoyama/moleditpy-plugins/dispatches" \
              -d "{\"event_type\":\"plugin_release\",\"client_payload\":{\"repo\":\"${{ github.repository }}\",\"tag\":\"v$TAG\"}}"
          fi

  # Archiving runs here rather than from zenodo.yml's `release: published`
  # trigger: this workflow mints the release with GITHUB_TOKEN, and GitHub does
  # not raise workflow-triggering events for token-authored actions, so that
  # trigger never fires. Same shape as the main app's release.yml.
  zenodo-upload:
    # A tag push always archives; a manual dispatch can opt out.
    if: ${{ github.event_name == 'push' || inputs.zenodo }}
    runs-on: ubuntu-latest
    needs: release

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${{ github.event.inputs.version }}"
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "Archiving tag: $TAG"

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          gh release download "$TAG" --pattern "*.zip" --dir dist --skip-existing || true
          curl -L -o "dist/source.tar.gz" \
            "https://github.com/${{ github.repository }}/archive/refs/tags/${TAG}.tar.gz"
          ls -la dist/

      - name: Upload and Publish to Zenodo
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
        run: |
          if [ -z "$ZENODO_TOKEN" ]; then
            echo "ERROR: ZENODO_TOKEN is not set, so $TAG was released but not archived." >&2
            exit 1
          fi
          # --deposition-id is omitted on purpose: DEPOSITION_ID in the script
          # is the single source of truth for which record family to version.
          python scripts/update_zenodo.py \
            --publish \
            --version-string "$TAG" \
            dist/*
