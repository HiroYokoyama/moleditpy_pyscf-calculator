name: Real Qt callback regressions
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qt-callbacks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      REQUIRE_REAL_QT: '1'
      REQUIRED_QT_VERSION: '6.11.2'
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install PySide6-Essentials==6.11.2
      - run: python -m unittest discover -s tests -p test_qt_callbacks.py -v
