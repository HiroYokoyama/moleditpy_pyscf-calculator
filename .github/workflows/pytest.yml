name: Python CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      moleditpy_ref:
        description: 'MoleditPy branch, tag, or full commit SHA (blank uses repository default)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

env:
  MOLEDITPY_REF: ${{ inputs.moleditpy_ref || vars.MOLEDITPY_REF || 'migrate/pyside6-without-openbabel' }}

jobs:
  # ---------------------------------------------------------------------------
  # Standard test job — no external dependencies required
  # ---------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov mock numpy
        # Note: The test suite uses Python-level mocking for PySide6, and RDKit
        # to ensure fast, headless execution without X-servers or heavy dependencies.

    - name: Test with pytest
      run: |
        python -m pytest --cov=pyscf_calculator tests/ -v

  # ---------------------------------------------------------------------------
  # Integration test job — clones the main MoleditPy app to enable real
  # PluginContext tests (TestWithRealPluginContext in test_plugin_integration.py)
  # ---------------------------------------------------------------------------
  test-integration:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov mock numpy

    - name: Clone main MoleditPy application
      # Clone beside the plugin repo so the relative path ../python_molecular_editor
      # matches the CI_MAIN_APP_SRC env var set below.
      # 'continue-on-error: false' so we catch network failures explicitly.
      shell: bash
      run: |
        git init "../python_molecular_editor"
        git -C "../python_molecular_editor" remote add origin https://github.com/HiroYokoyama/python_molecular_editor.git
        git -C "../python_molecular_editor" fetch --depth 1 origin "$MOLEDITPY_REF"
        git -C "../python_molecular_editor" checkout --detach FETCH_HEAD
        git -C "../python_molecular_editor" log -1 --format="%H %s"

    - name: Install main app Python package (editable, no extras)
      # Install only the package metadata so PluginContext can be imported.
      # We skip heavy GUI deps (pyvista, PySide6) — they are mocked in tests.
      run: |
        pip install -e ../python_molecular_editor/moleditpy \
          --no-deps --quiet || true

    - name: Test with real PluginContext
      env:
        CI_MAIN_APP_SRC: ${{ github.workspace }}/../python_molecular_editor/moleditpy/src
      run: |
        python -m pytest tests/test_plugin_integration.py tests/test_api.py -v
