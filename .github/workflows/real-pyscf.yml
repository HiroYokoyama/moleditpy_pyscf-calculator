name: Real PySCF tests

# tests_real/: the plugin driven against real PySCF (geomeTRIC, pyberny,
# pyscf-dispersion, RDKit, offscreen PyQt6), every result checked against an
# independent PySCF reference. Separate from pytest.yml, which runs the fast
# mocked suite. The minutes-long SN2 tutorial run is marked `slow` and left
# out here; its real results are covered by tests_real/test_real_fixtures.py.

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-pyscf:
    name: real PySCF (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    env:
      QT_QPA_PLATFORM: offscreen
      OMP_NUM_THREADS: "2"
      PYTHONUNBUFFERED: "1"

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: System libraries for Qt / VTK (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyscf geometric pyberny \
          rdkit PyQt6 pyvista matplotlib pillow pytest
        python -c "import pyscf, geometric, rdkit; print('pyscf', pyscf.__version__)"

    # No Apple Silicon wheel exists; the fallback (1.0.0) breaks `import
    # pyscf`. The dispersion tests skip themselves without it.
    - name: pyscf-dispersion (Linux)
      if: runner.os == 'Linux'
      run: |
        pip install pyscf-dispersion
        python -c "import pyscf.dispersion"

    - name: Real PySCF tests
      run: |
        python -m pytest tests_real -v -m "not slow" --durations=20
